<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF8F2">
<title>Manage | Tracie’s Works of Heart</title>
<style>
:root{--paper:#fbf8f2;--ink:#2f3a31;--muted:#62695e;--line:#dcded2;--green:#3b5241;--clay:#a4663b;--text-sm:.875rem;--text-base:1rem;--text-title:clamp(1.75rem,4vw,2rem)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:var(--text-base)/1.5 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--clay);outline-offset:4px}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:8px;background:white;padding:12px;z-index:10}
.wrap{max-width:600px;margin:auto;padding:0 24px}header{padding:24px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:1.125rem Georgia,serif;text-decoration:none}.brand span{color:var(--clay)}.back{font-size:var(--text-sm);display:flex;align-items:center;min-height:44px;white-space:nowrap}main{padding:16px 0 48px}h1{font:400 var(--text-title)/1.2 Georgia,serif;margin:0 0 24px}form{background:white;border:1px solid #eee9e0;border-radius:20px;padding:24px;display:grid;gap:24px}label{font-weight:600;display:block;margin-bottom:8px}textarea,input[type=number]{border:1px solid #cdd2c5;border-radius:10px;width:100%;padding:12px 16px;background:#fff;color:var(--ink);min-height:52px}textarea{min-height:112px;resize:vertical}#photo{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.photo{position:relative}#choose{width:100%;min-height:164px;border:1.5px dashed #b7c1b0;border-radius:12px;background:#f6f6ef;color:var(--green);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:24px;font-weight:600}#choose svg{width:32px;height:32px}#preview{display:block;max-width:100%;max-height:260px;object-fit:contain;border-radius:8px}#preview[hidden]{display:none}#preview:not([hidden])~svg{display:none}.pricebox{position:relative}.currency{position:absolute;top:12px;left:16px;color:var(--muted);pointer-events:none}#price{padding-left:36px}.primary{width:100%;min-height:52px;background:var(--green);color:white;border:0;border-radius:10px;padding:12px 20px;font-weight:600}.secondary{min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;color:var(--green);background:white}.status{font-size:var(--text-sm);margin:0;color:var(--muted)}.status:empty{display:none}.status.error{color:#9d3326}.notice{font-size:var(--text-sm);margin:16px 0 0;color:var(--muted)}h2{font-size:1.125rem;margin:40px 0 16px;font-weight:600}.piece{padding:16px 0;border-bottom:1px solid var(--line)}.details{display:flex;gap:16px;align-items:center}.details img{width:64px;height:64px;object-fit:cover;border-radius:8px}.details strong{display:block}.details p{margin:4px 0;color:var(--muted);font-size:var(--text-sm)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.empty{color:var(--muted);font-size:var(--text-sm)}.confirm{padding:16px;background:#f1e5dd;border-radius:10px;margin-top:12px}.confirm p{margin:0 0 12px}.confirm button{margin-right:8px}.danger{color:#9d3326}#cancel{margin-top:-8px}footer{text-align:center;font-size:var(--text-sm);color:var(--muted);padding:0 0 32px}footer a{display:inline-flex;align-items:center;min-height:44px}@media(max-width:420px){.wrap{padding:0 16px}form{padding:20px}header{gap:8px}.brand{font-size:1rem}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
<header><a class="brand" href="index.html">Tracie’s Works of <span>Heart</span></a><a class="back" href="index.html">View shop</a></header>
<main id="main">
<h1>Add a piece</h1>
<form id="form" novalidate>
<div class="photo">
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif">
<button type="button" id="choose" aria-controls="photo">
<img id="preview" alt="Your selected photo" hidden>
<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M11 8l2-3h6l2 3h5a3 3 0 013 3v14a3 3 0 01-3 3H6a3 3 0 01-3-3V11a3 3 0 013-3h5z" stroke="currentColor" stroke-width="1.7"/><circle cx="16" cy="18" r="6" stroke="currentColor" stroke-width="1.7"/></svg>
<span id="chooseText">Choose photo</span>
</button>
</div>
<div><label for="description">Description</label><textarea id="description" placeholder="Tell us a little about this piece." maxlength="3000" required></textarea></div>
<div><label for="price">Price <span style="font-weight:400;color:var(--muted)">(CAD)</span></label><div class="pricebox"><span class="currency">$</span><input id="price" type="number" inputmode="decimal" min="0.01" max="999999" step="0.01" placeholder="0.00" required></div></div>
<button type="submit" class="primary" id="post">Post</button>
<button type="button" class="secondary" id="cancel" hidden>Cancel edit</button>
<p id="status" class="status" role="status" aria-live="polite"></p>
</form>
<p id="publishingNote" class="notice" hidden>Posting isn’t ready yet. The site owner needs to finish connecting publishing. Nothing you enter here will be posted until then.</p>
<section aria-labelledby="piecesTitle"><h2 id="piecesTitle">Your pieces</h2><div id="list"><p class="empty">Loading your pieces…</p></div></section>
</main>
<footer><a href="index.html">Back to the shop</a></footer>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id),REPO='repos/SavannahSidle/WorkofHeart';
let token='';try{token=localStorage.getItem('tracie-gh-token')||''}catch{}
let listings=[],sha=null,editing=null,photoData='',busy=false,reading=false;
const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n/100);
const title=d=>String(d).split(/[.!?]/)[0].trim()||'Handmade piece';
function status(text,error=false){$('status').textContent=text;$('status').className='status'+(error?' error':'')}
function readiness(){$('publishingNote').hidden=!!token}
function encode(text){return btoa(Array.from(new TextEncoder().encode(text),b=>String.fromCharCode(b)).join(''))}
function decode(text){return new TextDecoder().decode(Uint8Array.from(atob(text.replace(/\n/g,'')),c=>c.charCodeAt(0)))}
async function api(method,path,body){
  if(!token)throw Error('Posting isn’t connected yet. Your piece has not been posted.');
  const response=await fetch('https://api.github.com/'+REPO+'/contents/'+path,{method,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const data=await response.json().catch(()=>({}));
  if(!response.ok){const e=Error(response.status===401||response.status===403?'Posting isn’t available. Your changes have not been saved.':response.status===409?'The shop changed on another device. Reload before trying again.':'Couldn’t save this change. Please try again.');e.code=response.status;throw e}
  return data;
}
async function load(){
  if(token){try{const file=await api('GET','listings.json');sha=file.sha;listings=JSON.parse(decode(file.content)).listings||[]}catch(e){if(e.code!==404)status(e.message,true)}}
  else{try{const r=await fetch('listings.json',{cache:'no-store'});if(r.ok)listings=(await r.json()).listings||[]}catch{}}
  render();
}
async function save(next,message){
  const result=await api('PUT','listings.json',{message,content:encode(JSON.stringify({version:1,listings:next},null,2)),...(sha?{sha}: {})});
  sha=result.content.sha;listings=next;render();
}
function render(){
  const list=$('list');list.replaceChildren();
  if(!listings.length){const p=document.createElement('p');p.className='empty';p.textContent='Your pieces will appear here after you post them.';list.append(p);return}
  for(const item of [...listings].reverse()){
    const article=document.createElement('article');article.className='piece';
    const details=document.createElement('div');details.className='details';
    const img=document.createElement('img');img.src=item.image;img.alt='';img.loading='lazy';
    const info=document.createElement('div'),name=document.createElement('strong'),price=document.createElement('p');name.textContent=title(item.description);price.textContent=money(item.price)+' CAD'+(item.sold?' · Sold':'');info.append(name,price);details.append(img,info);article.append(details);
    const actions=document.createElement('div');actions.className='actions';
    const action=(label,fn)=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.disabled=busy||!token;b.onclick=fn;actions.append(b);return b};
    action('Edit',()=>edit(item));
    action(item.sold?'Mark available':'Mark sold',()=>change(listings.map(x=>x.id===item.id?{...x,sold:!x.sold}:x),'Update availability'));
    action('Delete',()=>{
      if(article.querySelector('.confirm'))return;
      const box=document.createElement('div');box.className='confirm';
      const p=document.createElement('p');p.textContent='Delete this piece from the shop?';
      const yes=document.createElement('button');yes.type='button';yes.className='secondary danger';yes.textContent='Delete piece';yes.onclick=()=>change(listings.filter(x=>x.id!==item.id),'Remove piece');
      const no=document.createElement('button');no.type='button';no.className='secondary';no.textContent='Keep it';no.onclick=()=>box.remove();box.append(p,yes,no);article.append(box);
    });
    article.append(actions);list.append(article);
  }
}
async function change(next,message){
  if(busy)return;busy=true;render();status('Saving…');
  try{await save(next,message);status('Saved. The shop will update shortly.')}catch(e){status(e.message,true)}finally{busy=false;render()}
}
function reset(){editing=null;photoData='';$('form').reset();$('preview').hidden=true;$('preview').removeAttribute('src');$('chooseText').textContent='Choose photo';$('post').textContent='Post';$('cancel').hidden=true;document.querySelector('h1').textContent='Add a piece'}
function edit(item){editing=item;photoData='';$('description').value=item.description;$('price').value=(item.price/100).toFixed(2);$('preview').src=item.image;$('preview').hidden=false;$('chooseText').textContent='Change photo';$('post').textContent='Save changes';$('cancel').hidden=false;document.querySelector('h1').textContent='Edit piece';status('');window.scrollTo({top:0,behavior:'smooth'})}
$('cancel').onclick=()=>{reset();status('')};
$('choose').onclick=()=>$('photo').click();
$('photo').onchange=async()=>{
  const file=$('photo').files[0];if(!file)return;
  if(!file.type.startsWith('image/')){status('Please choose a photo.',true);return}
  reading=true;$('post').disabled=true;status('Preparing photo…');
  let url;
  try{
    url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();
    const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const data=canvas.toDataURL('image/jpeg',.82);photoData=data.split(',')[1];$('preview').src=data;$('preview').hidden=false;$('chooseText').textContent='Change photo';status('');
  }catch{status('This photo couldn’t be opened. Please choose a JPEG or PNG.',true)}
  finally{if(url)URL.revokeObjectURL(url);reading=false;$('post').disabled=false}
};
$('form').onsubmit=async event=>{
  event.preventDefault();if(busy||reading)return;
  if(!photoData&&!editing){status('Choose a photo first.',true);$('choose').focus();return}
  const description=$('description').value.trim(),price=Math.round(Number($('price').value)*100);
  if(!description){status('Add a short description.',true);$('description').focus();return}
  if(!Number.isFinite(price)||price<1||price>99999900){status('Enter a price greater than zero.',true);$('price').focus();return}
  if(!token){status('Posting isn’t connected yet. Your piece has not been posted. Please keep this page open.',true);return}
  busy=true;$('post').disabled=true;$('choose').disabled=true;render();status('Posting…');
  try{
    let image=editing?.image;
    const id=editing?.id||'p'+crypto.randomUUID().replaceAll('-','');
    if(photoData){const path='images/'+id+'-'+Date.now()+'.jpg';await api('PUT',path,{message:'Upload piece photo',content:photoData});image=path}
    const piece={...(editing||{}),id,image,description,price,sold:editing?.sold||false,updatedAt:Date.now()};
    const next=editing?listings.map(x=>x.id===id?piece:x):[...listings,piece];
    await save(next,editing?'Update piece':'Post piece');reset();status('Posted. The shop will update shortly.');
  }catch(e){status(e.message||'Couldn’t post. Your photo and details are still here.',true)}
  finally{busy=false;$('post').disabled=false;$('choose').disabled=false;render()}
};
readiness();load();
</script>
</body></html>
